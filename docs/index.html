    <script>
      // 1. Calculate repository base path dynamically and set <base href="...">
      // Ensures all relative assets (./assets/..., ./manifest.json, icons) resolve correctly
      // regardless of whether URL is /, /owner, /owner/, or GitHub Pages subpaths.
      (function() {
        var l = window.location;
        var isGitHub = l.hostname.endsWith('github.io');
        var segments = l.pathname.split('/').filter(Boolean);
        var repoName = (isGitHub && segments.length > 0 && segments[0] !== 'owner') ? segments[0] : '';
        var basePath = repoName ? ('/' + repoName + '/') : '/';
        document.write('<base href="' + basePath + '">');
      })();

      // 2. Single Page App redirect handler for GitHub Pages (restores path from 404.html)
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          var normalizedPath = decoded.replace(/\/+$/, '');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + (normalizedPath || '/') + l.hash);
        }
      }(window.location));
    </script>
