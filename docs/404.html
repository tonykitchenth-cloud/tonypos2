<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tony's Kitchen</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Detect whether deployed on github.io with a repository subpath (keep 1 segment) or root domain (keep 0)
      sessionStorage.redirect = location.href;
      var isGitHubPagesSubpath = Boolean(
        location.hostname.endsWith('github.io') &&
        location.pathname.split('/').filter(Boolean).length >= 1
      );
      var pathSegmentsToKeep = isGitHubPagesSubpath ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Tony's Kitchen...</p>
  </body>
</html>
