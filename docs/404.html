<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tony's Kitchen</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Detect whether deployed on github.io with a repository subpath (keep 1 segment) or root domain (keep 0)
      (function() {
        var l = window.location;
        sessionStorage.redirect = l.href;
        var isGitHubPages = l.hostname.endsWith('github.io');
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var pathSegmentsToKeep = (isGitHubPages && pathSegments.length > 0 && pathSegments[0] !== 'owner') ? 1 : 0;
        
        var repoPrefix = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var routePart = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repoPrefix + '/?/' + routePart.replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
          
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Tony's Kitchen...</p>
  </body>
</html>
